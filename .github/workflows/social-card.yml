name: Update share card

# Rebuilds images/social-card.jpg (the link-preview image for LinkedIn, X, WhatsApp...)
# whenever the profile changes in Pages CMS, then rebuilds the site.
on:
  push:
    branches: [main]
    paths:
      - "_data/profile.yml"
      - ".github/scripts/make_social_card.py"
      - ".github/workflows/social-card.yml"
  workflow_dispatch:

permissions:
  contents: write
  pages: write

concurrency:
  group: social-card
  cancel-in-progress: true

jobs:
  card:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install fonts
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq --no-install-recommends fonts-noto-core fonts-jetbrains-mono fontconfig > /dev/null

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Build the card
        run: |
          pip install --quiet pillow pyyaml
          python .github/scripts/make_social_card.py

      - name: Commit and rebuild the site if the card changed
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if git diff --quiet -- images/social-card.jpg; then
            echo "Share card unchanged."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add images/social-card.jpg
          git commit -m "Update share card from profile"
          git pull --rebase --quiet
          git push
          gh api -X POST "repos/${{ github.repository }}/pages/builds" --silent || echo "Pages build request failed; it will rebuild on the next change."
