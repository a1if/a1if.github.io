  featured: false
  live_demo: false
  badges: []
  description: ""
  points:
    - "Bilingual (Bangla & English) RAG over PDFs, scans, Office files and images, with Tesseract OCR, answering in the user's language with page-level citations."
    - "Hybrid retrieval: BM25 plus multilingual-e5 embeddings in FAISS, merged with reciprocal rank fusion, in per-session document stores."
    - "LLM-routed web search: the model decides when fresh information is needed, rewrites the query and sizes the Tavily search. Streams answers from Gemini or Groq (gpt-oss-20b) via FastAPI + Streamlit."
