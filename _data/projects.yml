- title: "ECG Multi-Agent Triage: Heterogeneous Edge AI for Clinical Decision Support"
  url: ""
  featured: true
  image: /images/ecg-triage-demo.webp
  image_alt: "Demo of the ECG triage app: analysing a recording, the two agents' conversation, adapter vs text charts, and clinician Q&A"
  live_demo: true
  badges:
    - MSc dissertation
  description: >-
    A two-agent ECG triage system. A CNN-LSTM perception agent classifies heartbeats and passes events to
    a frozen Gemma reasoning agent, either as text or as learned virtual tokens. It includes guardrails,
    an orchestrator and clinician Q&A. This is a research prototype.
  points:
    - "**24–78%** faster LLM prompt processing than compact text, with balanced accuracy of **0.83 vs 0.73** at 10 and 20 events."
    - "**10–30%** higher throughput and **12–28%** less energy per decision on a 12 GB GPU, measured with NVML at 100 Hz."
  links:
    - label: Try the live demo ↗
      url: https://ecg-multi-agent-triage.streamlit.app/
      primary: true
    - label: App code
      url: https://github.com/a1if/ecg-multi-agent-triage
      primary: false
    - label: Research code
      url: https://github.com/a1if/Heterogeneous-Multi-Agent-Edge-AI-for-Clinical-Decision-Support
      primary: false
  note: Hosted on Streamlit's free tier. If the app is asleep, click "wake up" and give it about 30 seconds.
  language: Python
  stack: PyTorch · Gemma · Streamlit
  tags: []

